<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meme Generator</title>
  </head>
  <body>
    <div class="topheader">
      <h1>MEME GENERATOR</h1>
    </div>
    <div class="bottomheader">
      <p>
        To generate a meme, insert your funny text along with an image URL. Then
        click the generate button and a funny combination will appear.
      </p>
    </div>

    <div class="flexview">
      <form id="memeform" class="memeform">
        <div class="form-example">

          <label>Top Text: </label>
          <input
            type="text"
            id="toptext"
            class="textbar"
            required
          />
        </div>

        <div class="form-example">
          <label>Bottom Text: </label>

          <input
            type="text"
            id="bottomtext"
            class="textbar"
            required
          />
        </div>

        <div class="form-example">
          <label>Image URL: </label>

          <input
            type="url"
            id="imageurl"
            class="textbar"
            placeholder="https://example.com"
            pattern="https://.*"
            size="30"
            required
          />
        </div>

        <div class="form-example">
          <input
            type="submit"
            value="Generate!"
            class="generatebutton"
            id="generatebutton"
          />
        </div>
      </form>
      <img class="memeimage" id="memeimage" src=""></img>
    </div>

    <div class="presetimages" id="presetimages">
      <!-- <img src="./images/" /> -->
    </div>

    
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
