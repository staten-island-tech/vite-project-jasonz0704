<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meme Generator</title>
  </head>
  <body>
    <div class="topheader">
      <h1>MEME GENERATOR</h1>
    </div>
    <div class="bottomheader">
      <p>
        To generate a meme, insert your funny text along with an image URL. Then
        click the generate button and a funny combination will appear.
      </p>
    </div>

    <div class="flexview">
      <form id="memeform" class="memeform">
        <div class="form-example">
          <label for="toptext" id="toptext">Top Text: </label>
          <input
            type="text"
            name="toptext"
            id="toptext"
            class="textbar"
            required
          />
        </div>

        <div class="form-example">
          <label for="bottomtext" id="bottomtext">Bottom Text: </label>

          <input
            type="text"
            name="bottomtext"
            id="bottomtext"
            class="textbar"
            required
          />
        </div>

        <div class="form-example">
          <label for="imageurl" id="imageurl">Image URL: </label>

          <input
            type="url"
            name="url"
            id="url"
            placeholder="https://example.com"
            pattern="https://.*"
            size="30"
            required
            class="textbar"
          />
        </div>

        <div class="form-example">
          <input
            type="submit"
            value="Generate!"
            class="generatebutton"
            id="generatebutton"
          />
        </div>
      </form>

      <canvas class="memecanvas" id="memecanvas"></canvas>
    </div>

    <div class="presetimages" id="presetimages"></div>

    <img src="./images/" />
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
